# Optional PostgreSQL. SQLite stays the default, so this is not needed to run the project.
#
#   docker compose up -d
#   $env:DATABASE_URL = "postgresql+psycopg://portal:portal@localhost:5432/portal"
#   cd backend; alembic upgrade head; python -m scripts.seed; uvicorn app.main:app --reload
#
# Data lives in the named volume, so it survives "docker compose down" and "up".
# Only "docker compose down -v" removes it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portal_postgres_data:
