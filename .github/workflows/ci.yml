name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      # Checked before retraining, against the committed artifacts, so a report that has
      # drifted from them fails here on any platform.
      - name: Committed report matches committed artifacts
        run: pytest -q tests/test_model_report.py -k "matches_the_artifacts"
      - name: Run migrations
        run: alembic upgrade head
      - name: Train
        run: python -m scripts.train
      # The numbers could differ slightly on another operating system. That isn't drift, so
      # the report is rebuilt from this machine's artifacts before the full test run.
      - name: Rebuild the report from the new artifacts
        run: python -m scripts.build_report
      - name: Seed
        run: python -m scripts.seed
      - name: Run tests
        run: pytest -q
      - name: Check the database
        run: python -m scripts.check_db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build
